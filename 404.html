<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>404 — AI Breakthroughs</title>
<style>
body{background:#0b0e14;color:#e6ebf4;font:16px/1.6 -apple-system,Helvetica,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;margin:0}
.c{max-width:480px;padding:32px}
h1{font-size:60px;color:#5ea0ff;margin:0 0 8px}
p{color:#8b95a9;margin:8px 0 22px}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
nav a{color:#e6ebf4;background:#121722;border:1px solid #232b3d;border-radius:999px;padding:8px 18px;text-decoration:none;font-size:14px}
nav a:hover{border-color:#5ea0ff;color:#5ea0ff}
</style>
</head>
<body><div class="c">
<h1>404</h1>
<p>That page drifted off the timeline. These are the real ones:</p>
<nav>
  <a id="l-index" href="index.html">Timeline</a>
  <a id="l-review" href="review.html">Review</a>
  <a id="l-about" href="about.html">Methodology</a>
  <a id="l-data" href="data/breakthroughs.json">Data JSON</a>
</nav>
<script>
/* GitHub Pages project sites serve 404.html at the mistyped URL's directory,
   so resolve repo-root links against the location path. */
(function(){
  var seg=location.pathname.split('/').filter(Boolean);
  var root=location.origin+'/';
  /* repo name = first path segment when hosted under github.io/<repo>/ */
  if(location.hostname.endsWith('github.io')&&seg.length){root+=seg[0]+'/';}
  ['index.html','review.html','about.html','data/breakthroughs.json'].forEach(function(f,i){
    document.getElementById(['l-index','l-review','l-about','l-data'][i]).href=root+f;
  });
})();
</script>
</div></body>
</html>
