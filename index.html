<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Breakthroughs — 1943 → Now</title>
<style>
:root{
  --bg:#0b0e14; --panel:#10141d; --card:#121722; --border:#232b3d; --border2:#2e3a52;
  --fg:#e6ebf4; --muted:#8b95a9; --faint:#5b6478;
  --accent:#5ea0ff; --gold:#ffc857; --hot:#ff6b6b; --green:#4ade80;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"SF Pro Text",Helvetica,Arial,sans-serif}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(11,14,20,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand span{color:var(--accent)}
.searchwrap{flex:1;position:relative;max-width:520px}
.searchwrap input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--fg);padding:7px 60px 7px 32px;font-size:13.5px;outline:none}
.searchwrap input:focus{border-color:var(--accent)}
.searchwrap .mag{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--faint);font-family:var(--mono);font-size:11px;border:1px solid var(--border);border-radius:4px;padding:1px 6px;background:var(--bg)}
.viewtabs{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.viewtabs button{background:transparent;border:none;color:var(--muted);padding:6px 13px;font-size:12.5px;cursor:pointer;border-right:1px solid var(--border)}
.viewtabs button:last-child{border-right:none}
.viewtabs button.active{background:var(--accent);color:#0b0e14;font-weight:600}
.count{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{color:var(--fg)}

/* ---------- layout ---------- */
main{max-width:1280px;margin:0 auto;padding:18px 20px 90px}

/* ---------- TIMELINE view ---------- */
.tl-wrap{position:relative;margin-left:88px}
.tl-wrap::before{content:"";position:absolute;left:-22px;top:6px;bottom:6px;width:2px;background:var(--border)}
.era-band{margin:30px 0 4px;display:flex;align-items:center;gap:10px;margin-left:-110px}
.era-band h3{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);background:var(--bg);padding:2px 0}
.era-band .rng{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.tl-item{position:relative;display:flex;gap:0;padding:9px 0;border-bottom:1px solid rgba(35,43,61,.45)}
.tl-item:hover{background:rgba(94,160,255,.04)}
.tl-item::before{content:"";position:absolute;left:-27px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--accent);cursor:pointer}
.tl-item.gold::before{border-color:var(--gold)}
.tl-year{position:absolute;left:-88px;width:58px;text-align:right;color:var(--accent);font-weight:650;font-variant-numeric:tabular-nums;top:9px;font-size:13px}
.tl-body{flex:1;min-width:0}
.tl-title{font-weight:600;font-size:14.5px;cursor:pointer}
.tl-title:hover{color:var(--accent)}
.tl-title .star{color:var(--gold);margin-left:6px;font-size:12px}
.tl-meta{color:var(--muted);font-size:12.5px;margin-top:1px}
.tl-meta a{color:var(--accent);text-decoration:none}
.tl-meta a:hover{text-decoration:underline}
.tl-detail{display:none;margin-top:8px;border-left:2px solid var(--border2);padding-left:12px;color:var(--muted);font-size:13px}
.tl-item.open .tl-detail{display:block}
.tl-detail p{margin:3px 0}
.tl-detail b{color:var(--fg)}
.scores-line{display:flex;gap:14px;margin-top:6px;font-size:11.5px;color:var(--faint);align-items:center;font-variant-numeric:tabular-nums}
.mini-bar{width:70px;height:4px;background:var(--border);border-radius:99px;display:inline-block;vertical-align:middle;margin-left:5px;overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--accent)}
.mini-bar.s i{background:var(--hot)}

/* ---------- TABLE view ---------- */
table.db{width:100%;border-collapse:collapse;font-size:13px}
table.db th{position:sticky;top:52px;z-index:5;background:var(--panel);text-align:left;padding:8px 10px;border-bottom:2px solid var(--border2);color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;user-select:none;white-space:nowrap}
table.db th:hover{color:var(--fg)}
table.db th .arr{color:var(--accent);margin-left:3px}
table.db td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
table.db tr.row:hover td{background:rgba(94,160,255,.05);cursor:pointer}
td.yr{color:var(--accent);font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
td.imp,td.sup{font-variant-numeric:tabular-nums;text-align:center}
td.cbm{font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.star-cell{color:var(--gold);text-align:center}
.era-chip{display:inline-block;font-size:10.5px;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 6px;white-space:nowrap}

/* ---------- GRAPH view ---------- */
.graph-svg{width:100%;height:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px}
.g-node{cursor:pointer}
.g-node circle{fill:var(--card);stroke:var(--accent);stroke-width:1.2}
.g-node.gold circle{stroke:var(--gold)}
.g-node text{fill:var(--fg);font-size:10.5px;pointer-events:none}
.g-node .gy{fill:var(--accent);font-size:10px;font-variant-numeric:tabular-nums}
.g-node:hover circle{fill:#1a2436}
.g-edge{stroke:var(--border2);stroke-width:1;fill:none}
.g-note{fill:var(--faint);font-size:10.5px}

/* ---------- LIST view ---------- */
.list-row{display:flex;gap:12px;padding:8px 10px;border-bottom:1px solid var(--border);align-items:baseline;cursor:pointer}
.list-row:hover{background:rgba(94,160,255,.05)}
.list-row .ly{min-width:46px;color:var(--accent);font-weight:650;font-variant-numeric:tabular-nums}
.list-row .lt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row .lc{color:var(--faint);font-size:11.5px;min-width:150px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- detail drawer ---------- */
.drawer{position:fixed;top:0;right:-560px;width:540px;max-width:92vw;height:100vh;background:var(--panel);border-left:1px solid var(--border2);z-index:100;transition:right .22s ease;overflow-y:auto;padding:26px 26px 40px}
.drawer.open{right:0}
.drawer .close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
.drawer .close:hover{color:var(--fg)}
.d-year{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.d-title{font-size:19px;font-weight:700;margin:4px 0 2px;line-height:1.3}
.d-org{color:var(--muted);font-size:13px;margin-bottom:14px}
.d-paper{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:16px}
.d-paper a{color:var(--accent);text-decoration:none;word-break:break-all}
.d-sec{margin:14px 0}
.d-sec h4{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin-bottom:5px}
.d-sec p{color:var(--muted);font-size:13.5px;line-height:1.55}
.score-grid{display:flex;gap:10px;margin:16px 0}
.score-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.score-box .v{font-size:20px;font-weight:750;font-variant-numeric:tabular-nums}
.score-box .l{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.score-box.cb{border-color:var(--gold)} .score-box.cb .v{color:var(--gold)}

/* ---------- site nav (shared across pages) ---------- */
.snav{display:flex;gap:2px;margin-left:auto}
.snav a{color:var(--muted);text-decoration:none;font-size:12.5px;padding:6px 11px;border-radius:8px;white-space:nowrap}
.snav a:hover{color:var(--fg);background:var(--card)}
.snav a.on{color:#0b0e14;background:var(--accent);font-weight:650}

/* ---------- command palette ---------- */
.palette-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.palette-backdrop.open{display:flex}
.palette{width:600px;max-width:92vw;background:var(--panel);border:1px solid var(--border2);border-radius:14px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.55)}
.palette input{width:100%;background:transparent;border:none;outline:none;color:var(--fg);font-size:15px;padding:15px 18px;border-bottom:1px solid var(--border)}
.p-results{max-height:46vh;overflow-y:auto;padding:6px}
.p-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);padding:8px 12px 3px}
.p-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13.5px}
.p-item.sel{background:rgba(94,160,255,.14)}
.p-item .pi-y{color:var(--accent);font-variant-numeric:tabular-nums;min-width:38px;font-weight:650}
.p-item .pi-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-item .pi-s{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.p-empty{padding:18px;color:var(--faint);text-align:center;font-size:13px}
.p-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--border);color:var(--faint);font-size:11px}
.p-foot b{color:var(--muted);font-family:var(--mono);font-weight:500}

/* ---------- community notes ---------- */
.cn{margin-top:12px;border:1px solid var(--border2);border-radius:12px;overflow:hidden;background:rgba(94,160,255,.05)}
.cn-h{display:flex;align-items:center;gap:8px;padding:9px 14px;background:rgba(94,160,255,.12);font-weight:650;font-size:13px}
.cn-b{padding:12px 14px;color:var(--muted);font-size:13.5px;line-height:1.55}
.cn-b a{color:var(--accent);text-decoration:none;word-break:break-all;margin-right:10px}
.cn-b a:hover{text-decoration:underline}
.cn-f{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--border);color:var(--faint);font-size:12px}
.cn-f .st{color:var(--green);font-weight:650}
.cn-f .st.pen{color:var(--gold)}
.cn-f .st.neg{color:var(--hot)}
.cn-f button{margin-left:auto;background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0}
.cn-f button:hover{text-decoration:underline}
.cn-badge{display:inline-flex;align-items:center;gap:5px;margin-top:5px;color:var(--green);font-size:11.5px;cursor:pointer;font-weight:600}
.cn-badge:hover{text-decoration:underline}
.tl-detail .cn{margin-top:10px}
.notebd{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:flex-start;justify-content:center;padding-top:9vh}
.notebd.open{display:flex}
.notemodal{width:560px;max-width:94vw;max-height:82vh;overflow-y:auto;background:var(--panel);border:1px solid var(--border2);border-radius:14px;padding:22px 24px}
.notemodal h3{font-size:16px;margin-bottom:6px}
.notemodal .close{float:right;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
.nm-sec{margin:16px 0}
.nm-sec h5{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin-bottom:7px}
.nm-tag{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;margin:5px 0}
.nm-tag .ok{color:var(--green)}
.nm-author{color:var(--fg);font-weight:650;font-size:13.5px}
.nm-ai{color:#b9a5ff;font-size:12.5px;margin-top:2px}
.nm-impact{color:var(--faint);font-size:12px}
.nm-disc{background:rgba(185,165,255,.08);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--muted);line-height:1.5}
.nm-foot{border-top:1px solid var(--border);margin-top:16px;padding-top:11px;color:var(--faint);font-size:11.5px;line-height:1.7}
.nm-foot b{color:var(--accent);font-weight:500}

.empty-state{padding:60px 0;text-align:center;color:var(--faint)}
@media(max-width:760px){.tl-wrap{margin-left:64px}.tl-year{left:-64px;width:44px}.viewtabs button{padding:6px 9px}}
</style>
</head>
<body>

<div class="topbar"><div class="topbar-in">
  <div class="brand">AI&nbsp;<span>Breakthroughs</span></div>
  <div class="searchwrap">
    <span class="mag">⌕</span>
    <input id="q" placeholder="Search titles, people, papers, tags…" autocomplete="off">
    <span class="kbd">/</span>
  </div>
  <div class="viewtabs">
    <button data-v="timeline" class="active">Timeline</button>
    <button data-v="table">Table</button>
    <button data-v="graph">Graph</button>
    <button data-v="list">List</button>
  </div>
  <nav class="snav">
    <a href="index.html" class="on">Timeline</a>
    <a href="review.html">Review</a>
    <a href="about.html">Methodology</a>
    <a href="data/breakthroughs.json">Data&nbsp;JSON</a>
  </nav>
  <div class="count" id="count"></div>
</div></div>

<main id="main"></main>

<aside class="drawer" id="drawer"><button class="close" onclick="closeDrawer()">✕</button><div id="drawer-body"></div></aside>

<div class="palette-backdrop" id="pal-bd"><div class="palette">
  <input id="pal-q" placeholder="Type a command or search breakthroughs…" autocomplete="off">
  <div class="p-results" id="pal-r"></div>
  <div class="p-foot"><span><b>↑↓</b> navigate</span><span><b>↵</b> open</span><span><b>esc</b> close</span><span style="margin-left:auto">try “impact ≥ 9” · “era transformer” · “go to table”</span></div>
</div></div>

<div class="notebd" id="notebd"></div>

<script>
let DATA=[], VIEW='timeline', SORT={k:'year',dir:1}, FILTER='', sel=0, palItems=[];

fetch('data/breakthroughs.json').then(r=>r.json()).then(rows=>{
  DATA=rows.sort((a,b)=>a.year-b.year);
  render(); updateCount();
});

const comb=d=>(d.impact+d.surprise)/2;
const $=id=>document.getElementById(id);
function filtered(){
  if(!FILTER) return DATA.slice();
  const t=FILTER.toLowerCase();
  return DATA.filter(d=>[d.title,d.org,d.paper,d.category,d.era,(d.tags||[]).join(' '),(d.people||[]).join(' '),String(d.year)]
    .some(f=>String(f).toLowerCase().includes(t)));
}

function updateCount(){const n=filtered().length;$('count').innerHTML=`<b>${n}</b> / ${DATA.length} entries`;}

/* ================= TIMELINE ================= */
function vTimeline(){
  const rows=filtered();
  let html='<div class="tl-wrap">', lastEra=null;
  rows.forEach(d=>{
    if(d.era!==lastEra){lastEra=d.era;
      const yrs=DATA.filter(x=>x.era===d.era);
      html+=`<div class="era-band"><h3>${d.era.replaceAll('-',' ')}</h3><span class="rng">${Math.min(...yrs.map(y=>y.year))}–${Math.max(...yrs.map(y=>y.year))} · ${yrs.length} entries</span></div>`;}
    html+=`<div class="tl-item ${comb(d)>=9?'gold':''}" data-id="${d.id}">
      <div class="tl-year">${d.year}</div>
      <div class="tl-body">
        <div class="tl-title" onclick="toggleItem(this)">${d.title}${comb(d)>=9?'<span class="star">★</span>':''}</div>
        <div class="tl-meta">${d.org} · ${(d.people||[]).slice(0,3).join(', ')}${(d.people||[]).length>3?' et al':''} · <a href="${d.url}" target="_blank" rel="noopener">paper ↗</a>${badgeFor(d)}</div>
        <div class="tl-detail">
          <p><b>Broke:</b> ${d.what_it_broke}</p>
          <p><b>Why it seemed impossible:</b> ${d.why_impossible}</p>
          <div class="scores-line">impact<span class="mini-bar"><i style="width:${d.impact*10}%"></i></span>${d.impact}/10
            &nbsp;sprz<span class="mini-bar s"><i style="width:${d.surprise*10}%"></i></span>${d.surprise}/10
            &nbsp;· combined <b style="color:var(--fg)">&nbsp;${comb(d).toFixed(1)}</b></div>
        </div>
      </div></div>`;
  });
  return html+'</div>';
}
function toggleItem(el){el.closest('.tl-item').classList.toggle('open');}

/* ================= TABLE ================= */
function vTable(){
  let rows=filtered().slice().sort((a,b)=>{
    const k=SORT.k;
    if(k==='_comb')return (comb(a)-comb(b))*SORT.dir;
    const va=a[k], vb=b[k];
    return (typeof va==='number'? va-vb : String(va).localeCompare(String(vb)))*SORT.dir;
  });
  const arr=k=>SORT.k===k?`<span class="arr">${SORT.dir>0?'↑':'↓'}</span>`:'';
  let html=`<table class="db"><thead><tr>
    <th onclick="sortBy('year')">Year${arr('year')}</th>
    <th onclick="sortBy('title')">Breakthrough${arr('title')}</th>
    <th onclick="sortBy('org')">Org${arr('org')}</th>
    <th onclick="sortBy('category')">Category${arr('category')}</th>
    <th style="text-align:center" onclick="sortBy('impact')">Imp${arr('impact')}</th>
    <th style="text-align:center" onclick="sortBy('surprise')">Spr${arr('surprise')}</th>
    <th style="text-align:center" onclick="sortBy('_comb')">Cmb${arr('_comb')}</th>
  </tr></thead><tbody>`;
  rows.forEach(d=>{html+=`<tr class="row" onclick="openDrawer('${d.id}')">
    <td class="yr">${d.year}</td>
    <td>${comb(d)>=9?'<span class="star-cell">★</span> ':''}${d.title}<br><span class="era-chip">${d.era.replaceAll('-',' ')}</span></td>
    <td style="color:var(--muted)">${d.org}</td>
    <td style="color:var(--muted)">${d.category}</td>
    <td class="imp">${d.impact}</td><td class="sup">${d.surprise}</td><td class="cbm">${comb(d).toFixed(1)}</td>
  </tr>`;});
  return html+'</tbody></table>';
}
function sortBy(k){
  if(SORT.k===k) SORT.dir*=-1; else {SORT.k=k;SORT.dir=1;}
  render();
}

/* ================= LIST ================= */
function vList(){
  const rows=filtered().sort((a,b)=>(comb(b)-comb(a)));
  let html='';
  rows.forEach((d,i)=>{html+=`<div class="list-row" onclick="openDrawer('${d.id}')">
    <span class="ly">${d.year}</span>
    <span class="lt">${comb(d)>=9?'<span style="color:var(--gold)">★</span> ':''}${d.title}</span>
    <span class="lc">${d.category} · ${comb(d).toFixed(1)}</span></div>`;});
  return html;
}

/* ================= GRAPH ================= */
function vGraph(){
  // lane per era (ordered by first year), x = year
  const eras=[...new Set(DATA.map(d=>d.era))];
  const lanes={}; eras.forEach(e=>{const ys=DATA.filter(d=>d.era===e).map(d=>d.year);
    lanes[e]={lo:Math.min(...ys),hi:Math.max(...ys)};});
  eras.sort((a,b)=>lanes[a].lo-lanes[b].lo);
  const W=1200,rowH=34,padL=130,padR=30,padT=30;
  const H=padT+eras.length*rowH+50;
  const x=y=>padL+((y-1940)/(2026-1940))*(W-padL-padR);
  let svg=`<svg class="graph-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for(let y=1950;y<=2020;y+=10)svg=`${svg}<line x1="${x(y)}" y1="${padT-8}" x2="${x(y)}" y2="${H-36}" stroke="var(--border)" stroke-width="1"/><text class="g-note" x="${x(y)}" y="${H-18}" text-anchor="middle">${y}</text>`;
  eras.forEach((e,i)=>{
    const cy=padT+i*rowH+rowH/2;
    DATA.filter(d=>d.era===e).forEach(d=>{
      const cx=x(d.year), r=3+d.impact*0.75;
      svg+=`<g class="g-node ${comb(d)>=9?'gold':''}" onclick='openDrawer("${d.id}")'><title>${d.year} — ${d.title}</title>
        <circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}"/>`;
      if(i%2===0||d.impact>=9)svg+=`<text x="${cx+r+3}" y="${cy+3.5}">${d.title.length>34?d.title.slice(0,33)+'…':d.title}</text>`;
      else svg+=`<text class="gy" x="${cx}" y="${cy-r-4}" text-anchor="middle">${d.year}</text>`;
      svg+='</g>';
    });
    svg+=`<text class="g-note" x="8" y="${cy+3.5}">${e.replaceAll('-',' ')}</text><line x1="8" y1="${cy+rowH/2}" x2="${W-padR}" y2="${cy+rowH/2}" stroke="var(--border)" stroke-width=".5" opacity=".5"/>`;
  });
  return svg+'</svg>';
}

/* ================= drawer ================= */
function openDrawer(id){
  const d=DATA.find(x=>x.id===id); if(!d)return;
  $('drawer-body').innerHTML=`
    <div class="d-year">${d.date||d.year}</div>
    <div class="d-title">${d.title}</div>
    <div class="d-org">${d.org} · ${(d.people||[]).join(', ')}</div>
    <div class="d-paper">📄 <a href="${d.url}" target="_blank" rel="noopener">${d.paper}</a></div>
    <div class="score-grid">
      <div class="score-box"><div class="v">${d.impact}</div><div class="l">impact</div></div>
      <div class="score-box"><div class="v">${d.surprise}</div><div class="l">surprise</div></div>
      <div class="score-box cb"><div class="v">${comb(d).toFixed(1)}</div><div class="l">combined</div></div>
    </div>
    <div class="d-sec"><h4>Era / Category</h4><p>${d.era.replaceAll('-',' ')} · ${d.category}</p></div>
    <div class="d-sec"><h4>What it broke</h4><p>${d.what_it_broke}</p></div>
    <div class="d-sec"><h4>Why it seemed impossible</h4><p>${d.why_impossible}</p></div>
    <div class="d-sec"><h4>Tags</h4><p style="color:var(--accent)">${(d.tags||[]).join(' · ')}</p></div>
    ${(d.notes||[]).length?`<div class="d-sec"><h4>Community notes</h4>${d.notes.map(n=>cnCard(d,n)).join('')}</div>`:''}`;
  $('drawer').classList.add('open');
}
function closeDrawer(){$('drawer').classList.remove('open');}

/* ================= community notes ================= */
const TAG_LABEL={
  helpfulImportantContext:'Provides important context',
  helpfulGoodSources:'Cites high-quality sources',
  helpfulClear:'Easy to understand',
  helpfulUniqueContext:'Provides unique context',
  helpfulAddressesClaim:'Addresses the claim',
  notHelpfulIncorrect:'Contains incorrect information',
  notHelpfulSourcesMissingOrUnreliable:'Sources missing or unreliable',
  notHelpfulOpinionSpeculationOrBias:'Opinion, speculation or bias',
  notHelpfulOutdated:'Outdated'
};
function noteStatus(n){
  if(n.classification==='not_helpful')return 'CURRENTLY_RATED_NOT_HELPFUL';
  let doms=new Set();
  (n.sources||[]).forEach(s=>{try{doms.add(new URL(s).hostname.replace(/^www\./,''))}catch(e){}});
  return (n.classification==='helpful'&&doms.size>=2&&(n.text||'').length>=120)
    ?'CURRENTLY_RATED_HELPFUL':'NEEDS_MORE_RATINGS';
}
const STATUS_META={
  CURRENTLY_RATED_HELPFUL:{cls:'st',label:'Helpful',
    why:'This note cites at least two independent sources and meets the helpful bar, so it is shown as context on the entry.'},
  NEEDS_MORE_RATINGS:{cls:'st pen',label:'Needs more ratings',
    why:'Not enough independent corroboration yet - this note stays off list views until it cites at least two distinct sources.'},
  CURRENTLY_RATED_NOT_HELPFUL:{cls:'st neg',label:'Rated not helpful',
    why:'Raters judged this note unhelpful; it remains hidden from public views.'}
};
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shortUrl(s){try{const u=new URL(s);let t=u.hostname.replace(/^www\./,'')+u.pathname;return t.length>42?t.slice(0,41)+'…':t}catch(e){return s}}
function cnCard(d,n){
  const st=noteStatus(n),m=STATUS_META[st];
  const links=(n.sources||[]).map(s=>`<a href="${esc(s)}" target="_blank" rel="noopener">${esc(shortUrl(s))}</a>`).join('');
  const who=n.author&&n.author.type==='ai'?'an AI note writer':'readers';
  return `<div class="cn">
    <div class="cn-h">👥 ${esc(who.charAt(0).toUpperCase()+who.slice(1))} added context people might want to know</div>
    <div class="cn-b">${esc(n.text)}${links?`<div style="margin-top:8px">${links}</div>`:''}</div>
    <div class="cn-f"><span class="${m.cls}">${st==='CURRENTLY_RATED_HELPFUL'?'✓':st==='NEEDS_MORE_RATINGS'?'⏳':'✖'} ${m.label}</span><span>·</span><span>${esc((n.created||'').slice(0,10))}</span><button onclick="openNote('${d.id}','${n.id}')">View details</button></div>
  </div>`;
}
function badgeFor(d){
  const n=(d.notes||[]).find(x=>noteStatus(x)==='CURRENTLY_RATED_HELPFUL');
  return n?`<div class="cn-badge" onclick="event.stopPropagation();openNote('${d.id}','${n.id}')">✓ Currently rated helpful · View details</div>`:'';
}
function openNote(eid,nid){
  const d=DATA.find(x=>x.id===eid);if(!d)return;
  const n=(d.notes||[]).find(x=>x.id===nid);if(!n)return;
  const st=noteStatus(n),m=STATUS_META[st];
  const a=n.author||{};
  $('notebd').innerHTML=`<div class="notemodal" onclick="event.stopPropagation()">
    <button class="close" onclick="closeNote()">✕</button><h3>Note Details</h3>
    <div class="nm-sec"><h5>Current Status</h5>
      <div class="nm-tag"><span class="ok">${st==='CURRENTLY_RATED_HELPFUL'?'✅':st==='NEEDS_MORE_RATINGS'?'⏳':'❌'}</span><b>${m.label}</b></div>
      <div style="color:var(--muted);font-size:13px;margin-top:5px;line-height:1.5">${m.why}</div>
      <div style="margin-top:7px"><a href="https://communitynotes.x.com/guide/en/under-the-hood/helpful-notes" target="_blank" rel="noopener" style="color:var(--accent);font-size:12.5px;text-decoration:none">Learn more</a></div>
    </div>
    <div class="nm-sec"><h5>Top tags selected by raters</h5>
      ${(n.tags||[]).map(t=>`<div class="nm-tag"><span class="ok">✔</span>${TAG_LABEL[t]||esc(t)}</div>`).join('')||'<div class="nm-tag" style="color:var(--faint)">none yet</div>'}
    </div>
    <div class="nm-sec"><h5>Note Author</h5>
      <div class="nm-author">🤖 ${esc(a.alias||'Unknown')}</div>
      <div class="nm-ai">${a.type==='ai'?'Experimental AI Note Writer':'Human Curator'}</div>
      <div class="nm-impact">${a.impact||0} Writing Impact</div>
    </div>
    ${a.type==='ai'?`<div class="nm-sec nm-disc">🤖 Proposed by an experimental AI contributor responding to signals on this entry. Like all contributors, AIs can make mistakes — verify accuracy.</div>`:''}
    <div class="nm-foot">⚙ Note status computed by open-source algorithm <b>ABCoreModel</b> (v0.1)<br>Note submitted ${esc((n.created||'').replace('T',' · ').replace('Z',' UTC'))} · Note ID ${esc(n.id)}</div>
  </div>`;
  $('notebd').classList.add('open');
}
function closeNote(){$('notebd').classList.remove('open')}

/* ================= palette ================= */
function palOpen(){$('pal-bd').classList.add('open');$('pal-q').value='';$('pal-q').focus();palUpdate('');}
function palClose(){$('pal-bd').classList.remove('open');}
function palUpdate(qraw){
  const q=qraw.trim().toLowerCase(); sel=0;
  const cmds=[
    {t:'View: Timeline',run:()=>setView('timeline')},
    {t:'View: Table',run:()=>setView('table')},
    {t:'View: Graph',run:()=>setView('graph')},
    {t:'View: List',run:()=>setView('list')},
    {t:'Sort: by impact ↓',run:()=>{SORT={k:'impact',dir:-1};setView('table')}},
    {t:'Sort: by surprise ↓',run:()=>{SORT={k:'surprise',dir:-1};setView('table')}},
    {t:'Sort: by combined score ↓',run:()=>{SORT={k:'_comb',dir:-1};setView('table')}},
    {t:'Filter: impossible-tier only (★)',run:()=>{$('q').value='';FILTER='';DATA.filter(d=>comb(d)>=9).forEach(()=>{});window.__star=true;setView('list');render()}},
  ];
  palItems=[];
  const mQ=q.match(/impact\s*(>=|≥)\s*(\d+)/); if(mQ){cmds.unshift({t:`Filter: impact ≥ ${mQ[2]}`,run:()=>{$('q').value='';FILTER='';window.__impMin=+mQ[2];setView('list');render()}});}
  const mE=q.match(/^era\s+(.+)$/); if(mE){const e=DATA.find(d=>d.era.includes(mE[1])); if(e)cmds.unshift({t:`Filter: era = ${e.era}`,run:()=>{$('q').value=e.era;FILTER=e.era;render()}});}
  cmds.forEach(c=>{if(!q||c.t.toLowerCase().includes(q))palItems.push({...c,g:'commands'});});
  DATA.filter(d=>!q||(d.title+' '+d.org).toLowerCase().includes(q)).slice(0,q?12:6)
    .forEach(d=>palItems.push({t:`${d.year} — ${d.title}`,s:comb(d).toFixed(1),g:'breakthroughs',run:()=>{closeAll();openDrawer(d.id)}}));
  let html='',lastG=null;
  palItems.forEach((it,i)=>{
    if(it.g!==lastG){html+=`<div class="p-group">${it.g}</div>`;lastG=it.g;}
    html+=`<div class="p-item ${i===sel?'sel':''}" onmouseover="palSel(${i})" onclick="palRun(${i})">
      ${it.g==='breakthroughs'?`<span class="pi-y">${it.t.slice(0,4)}</span>`:''}
      <span class="pi-t">${it.t.replace(new RegExp(`^${it.g==='breakthroughs'?'\\d{4} — ':''}`),'')}</span>
      ${it.s?`<span class="pi-s">${it.s}</span>`:''}</div>`;
  });
  $('pal-r').innerHTML=html||'<div class="p-empty">No matches</div>';
}
function palSel(i){sel=i;document.querySelectorAll('.p-item').forEach((el,j)=>el.classList.toggle('sel',j===i));}
function palRun(i){const it=palItems[i];if(it){palClose();it.run();updateCount();}}
function closeAll(){palClose();closeDrawer();closeNote();}

/* ================= shell ================= */
function setView(v){VIEW=v;document.title=`${v} · ${filtered().length} — AI Breakthroughs`;document.querySelectorAll('.viewtabs button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));render();}
function render(){
  const m=$('main');
  document.title=`${VIEW} · ${filtered().length} — AI Breakthroughs`;
  if(!DATA.length){m.innerHTML='<div class="empty-state">loading…</div>';return;}
  if(VIEW==='timeline')m.innerHTML=vTimeline();
  else if(VIEW==='table')m.innerHTML=vTable();
  else if(VIEW==='list')m.innerHTML=vList();
  else m.innerHTML=vGraph();
}
document.querySelectorAll('.viewtabs button').forEach(b=>b.onclick=()=>setView(b.dataset.v));

$('q').addEventListener('input',e=>{
  FILTER=e.target.value; window.__impMin=null; window.__star=false; updateCount(); render();
});

// patched list honoring numeric filters
const _baseList=vList;
vList=function(){
  let rows=filtered();
  if(window.__impMin)rows=rows.filter(d=>d.impact>=window.__impMin);
  if(window.__star)rows=rows.filter(d=>comb(d)>=9);
  rows=rows.slice().sort((a,b)=>comb(b)-comb(a));
  if(!rows.length)return '<div class="empty-state">Nothing matches these filters</div>';
  let html='';
  rows.forEach(d=>{html+=`<div class="list-row" onclick="openDrawer('${d.id}')">
    <span class="ly">${d.year}</span>
    <span class="lt">${comb(d)>=9?'<span style="color:var(--gold)">★</span> ':''}${d.title}</span>
    <span class="lc">${d.category} · imp ${d.impact} · spr ${d.surprise} · ${comb(d).toFixed(1)}</span></div>`;});
  return html;
};

document.addEventListener('keydown',e=>{
  const inInput=['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
  if($('notebd').classList.contains('open')){
    if(e.key==='Escape')closeNote();
    return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('pal-bd').classList.contains('open')?palClose():palOpen();return;}
  if($('pal-bd').classList.contains('open')){
    if(e.key==='Escape')palClose();
    else if(e.key==='ArrowDown'){e.preventDefault();palSel(Math.min(sel+1,palItems.length-1));}
    else if(e.key==='ArrowUp'){e.preventDefault();palSel(Math.max(sel-1,0));}
    else if(e.key==='Enter'){e.preventDefault();palRun(sel);}
    return;
  }
  if(inInput){
    if(e.key==='Escape'){e.target.blur();}
    return;
  }
  if(e.key==='/'){e.preventDefault();$('q').focus();}
  if(e.key==='Escape')closeAll();
});
$('pal-q').addEventListener('input',e=>palUpdate(e.target.value));
$('pal-bd').addEventListener('click',e=>{if(e.target.id==='pal-bd')palClose();});
$('drawer').addEventListener('click',e=>{if(e.target.id==='drawer')closeDrawer();});
$('notebd').addEventListener('click',e=>{if(e.target.id==='notebd')closeNote();});
</script>
</body>
</html>
